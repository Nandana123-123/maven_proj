name: Java CI with Maven and Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build and test with Maven
      run: mvn clean package

    # Saves the compiled JAR so the Docker job can use it
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maven-jar
        path: target/*.jar

  docker:
    runs-on: ubuntu-latest
    needs: build # Ensures the Docker job only runs if the build succeeds
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    # Downloads the JAR generated in the build job
    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: maven-jar
        path: target/

    # Builds your local Dockerfile image using the runner's native Docker engine
    - name: Build Docker Image
      run: |
        docker build -t my-java-app:${{ github.sha }} .
        docker tag my-java-app:${{ github.sha }} my-java-app:latest
